<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>빠른 입력 프로토타입</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #111;
      background: #d9d9d9;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      font-size: 14px;
    }
    button, input, textarea {
      font: inherit;
    }
    .popup {
      width: 542px;
      height: 424px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      border: 1px solid #9aa7b4;
      box-shadow: 0 1px 5px rgba(0,0,0,.18);
    }
    .search-area {
      padding: 10px 10px 0;
      border-bottom: 1px solid #c4d6ea;
    }
    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .logo {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 5px;
      color: #fff;
      background: #1f2937;
      font-size: 18px;
      font-weight: 800;
    }
    .search {
      flex: 1;
      height: 36px;
      padding: 0 10px;
      border: 0;
      border-bottom: 2px solid #0d6cc5;
      outline: none;
      font-size: 16px;
    }
    .hint {
      padding: 9px 0 10px;
      color: #111;
      font-size: 13px;
    }
    .list {
      height: 224px;
      overflow-y: auto;
      border-bottom: 1px solid #d7dde5;
    }
    .match {
      display: grid;
      grid-template-columns: 1fr 112px;
      gap: 8px;
      min-height: 52px;
      padding: 8px 10px 8px 14px;
      border-bottom: 1px solid #eef1f5;
      cursor: default;
    }
    .match:hover,
    .match.active {
      background: #9fccf1;
    }
    .content {
      min-width: 0;
      line-height: 1.45;
    }
    .summary {
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      white-space: normal;
    }
    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }
    .trigger {
      font-weight: 800;
    }
    .shortcut {
      margin-left: 4px;
      color: #6b7280;
      font-weight: 400;
    }
    .actions {
      display: flex;
      gap: 3px;
    }
    .mini {
      height: 22px;
      padding: 0 6px;
      border: 1px solid #b8cde7;
      border-radius: 1px;
      color: #1f4d7a;
      background: linear-gradient(#ffffff, #f3f8ff);
      cursor: pointer;
      font-size: 12px;
      line-height: 20px;
    }
    .mini:hover,
    .mini:focus {
      border-color: #f39800;
      color: #d86400;
      background: linear-gradient(#fffaf2, #fff0dc);
      outline: none;
    }
    .delete {
      color: #b42318;
    }
    .tester {
      padding: 8px 10px 10px;
      background: #f8fafc;
    }
    .tester-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      color: #334155;
      font-size: 12px;
    }
    .target {
      width: 100%;
      height: 82px;
      padding: 8px;
      border: 1px solid #bfc9d5;
      resize: none;
      line-height: 1.45;
      outline: none;
    }
  </style>
</head>
<body>
  <main class="popup" aria-label="빠른 입력 팝업">
    <section class="search-area">
      <div class="search-row">
        <div class="logo" aria-hidden="true">↵</div>
        <input class="search" id="searchWord" type="search" autocomplete="off" />
      </div>
      <div class="hint">내용이나 트리거로 검색하세요. 빠른 입력 창에서만 Alt+1~Alt+4가 적용됩니다.</div>
    </section>

    <section class="list" id="quickList" aria-label="빠른 입력 목록"></section>

    <section class="tester" aria-label="입력 테스트 영역">
      <div class="tester-head">
        <strong>입력 테스트</strong>
        <span id="status">항목을 더블클릭하거나 입력 버튼, Alt+숫자를 눌러보세요.</span>
      </div>
      <textarea class="target" id="targetContent" placeholder="선택한 내용이 여기에 입력됩니다."></textarea>
    </section>
  </main>

  <script>
    var quickItems = [
      {
        title: "테스트 3",
        trigger: ";gab",
        content: "안녕하세요.\n테스트용 빠른 입력 문구입니다.\n입력 버튼을 누르면 하단 입력 테스트 영역에 이 내용이 들어갑니다."
      },
      {
        title: "테스트 2",
        trigger: ";b5",
        content: "46배판 교재는 일반 단행본보다 편집·조판 공정이 복잡하고 다양한 구성 요소를 정리해야 하므로 작업 기간이 더 깁니다."
      },
      {
        title: "테스트",
        trigger: ";cys",
        content: "목록에서 내용을 먼저 확인한 뒤 필요한 문구만 입력할 수 있도록 구성한 예시입니다."
      },
      {
        title: "화살표",
        trigger: ";arr",
        content: "→\n←\n↑\n↓"
      }
    ];

    var list = document.getElementById("quickList");
    var searchWord = document.getElementById("searchWord");
    var targetContent = document.getElementById("targetContent");
    var status = document.getElementById("status");
    var visibleItems = quickItems.slice();

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function summary(value) {
      return value.replace(/\s+/g, " ").trim();
    }

    function render(items) {
      visibleItems = items;
      list.innerHTML = items.map(function(item, index) {
        return [
          '<article class="match' + (index === 0 ? ' active' : '') + '" data-index="' + index + '">',
          '<div class="content">',
          '<div class="summary">' + escapeHtml(summary(item.content)) + '</div>',
          '</div>',
          '<div class="meta">',
          '<div><span class="trigger">' + escapeHtml(item.trigger) + '</span><span class="shortcut">Alt+' + (index + 1) + '</span></div>',
          '<div class="actions">',
          '<button class="mini" type="button" accesskey="' + (index + 1) + '" data-action="apply" data-index="' + index + '">입력</button>',
          '<button class="mini" type="button" data-action="edit" data-index="' + index + '">수정</button>',
          '<button class="mini delete" type="button" data-action="delete" data-index="' + index + '">삭제</button>',
          '</div>',
          '</div>',
          '</article>'
        ].join("");
      }).join("");
    }

    function applyItem(item) {
      targetContent.value = item.content;
      status.textContent = item.trigger + " 입력 완료";
      targetContent.focus();
    }

    function filterList() {
      var keyword = searchWord.value.trim().toLowerCase();
      render(quickItems.filter(function(item) {
        return !keyword ||
          item.trigger.toLowerCase().indexOf(keyword) > -1 ||
          item.title.toLowerCase().indexOf(keyword) > -1 ||
          item.content.toLowerCase().indexOf(keyword) > -1;
      }));
    }

    list.addEventListener("click", function(event) {
      var match = event.target.closest(".match");
      if (!match) return;

      list.querySelectorAll(".match").forEach(function(row) {
        row.classList.remove("active");
      });
      match.classList.add("active");

      var control = event.target.closest("[data-action]");
      if (!control) return;
      event.preventDefault();

      var item = visibleItems[Number(control.getAttribute("data-index"))];
      var action = control.getAttribute("data-action");
      if (!item) return;

      if (action === "apply") {
        applyItem(item);
      } else if (action === "edit") {
        status.textContent = item.trigger + " 수정 화면으로 이동하는 자리입니다.";
      } else if (action === "delete") {
        status.textContent = item.trigger + " 삭제 확인을 띄우는 자리입니다.";
      }
    });

    list.addEventListener("dblclick", function(event) {
      var match = event.target.closest(".match");
      if (!match) return;
      var item = visibleItems[Number(match.getAttribute("data-index"))];
      if (item) applyItem(item);
    });

    searchWord.addEventListener("input", filterList);

    function shortcutIndex(event) {
      if (!event.altKey || event.ctrlKey) return -1;
      if (/^[1-9]$/.test(event.key)) return Number(event.key) - 1;
      if (/^Digit[1-9]$/.test(event.code)) return Number(event.code.replace("Digit", "")) - 1;
      if (/^Numpad[1-9]$/.test(event.code)) return Number(event.code.replace("Numpad", "")) - 1;
      return -1;
    }

    function handleShortcut(event) {
      var idx = shortcutIndex(event);
      if (idx < 0) return;

      var item = visibleItems[idx];
      if (item) {
        event.preventDefault();
        event.stopPropagation();
        applyItem(item);
      }
    }

    window.addEventListener("keydown", handleShortcut, true);
    window.addEventListener("keyup", handleShortcut, true);

    render(quickItems);
    searchWord.focus();
  </script>
</body>
</html>
