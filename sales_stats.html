<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도서 출고 및 반품 내역 - 검색 개선 목업</title>
  <style>
    :root {
      --blue: #28518f;
      --blue-dark: #173e79;
      --blue-soft: #eef5ff;
      --cyan-soft: #eef9fc;
      --line: #d7dde5;
      --text: #1f2937;
      --muted: #667085;
      --danger: #c9362b;
      --focus: #1c64d1;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: #fff;
      font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
      font-size: 13px;
    }
    button, input { font: inherit; }
    .top-line { height: 5px; background: var(--blue); }
    main { width: calc(100% - 80px); min-width: 1100px; margin: 0 auto; }
    h1 {
      margin: 4px 0 5px;
      color: var(--blue-dark);
      font-size: 25px;
      line-height: 34px;
      text-align: center;
      letter-spacing: -1px;
    }

    .search-panel {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      min-height: 66px;
      padding: 10px 14px;
      border: 1px solid #b9dbe5;
      background: var(--cyan-soft);
    }
    .field-group { display: flex; align-items: flex-start; gap: 6px; }
    .field-label { padding-top: 8px; color: #176286; white-space: nowrap; }
    .date-row { display: flex; align-items: center; gap: 5px; }
    .date-input, .combo-input {
      height: 34px;
      border: 1px solid #bfc8d4;
      border-radius: 3px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    .date-input { width: 112px; padding: 0 9px; }
    .combo { position: relative; width: 300px; }
    .combo-input { width: 100%; padding: 0 62px 0 34px; }
    .combo-input::placeholder { color: #98a2b3; }
    .combo-input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(28,100,209,.14); }
    .combo-icon { position: absolute; top: 8px; left: 10px; color: #667085; font-size: 15px; pointer-events: none; }
    .combo-state {
      position: absolute; top: 7px; right: 8px;
      padding: 2px 6px; border-radius: 10px;
      color: #667085; background: #f2f4f7; font-size: 11px;
      pointer-events: none;
    }
    .combo.is-selected .combo-input { border-color: #419261; background: #f6fff9; }
    .combo.is-selected .combo-state { color: #176b37; background: #dff4e6; }
    .combo.has-error .combo-input { border-color: var(--danger); }
    .book-lookup { position: relative; display: flex; width: 350px; }
    .search-select, .book-search-input {
      height: 34px;
      border: 1px solid #bfc8d4;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    .search-select { width: 82px; padding: 0 5px; border-radius: 3px 0 0 3px; }
    .book-search-input { width: 212px; margin-left: -1px; padding: 0 9px; }
    .book-search-input:focus { position: relative; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(28,100,209,.14); }
    .lookup-button {
      width: 56px; height: 34px; margin-left: -1px;
      border: 1px solid #6d7e94; border-radius: 0 3px 3px 0;
      color: #344054; background: #f7f8fa; cursor: pointer;
    }
    .lookup-button:hover { background: #e9edf2; }
    .book-lookup .suggestions { top: 38px; left: 82px; width: 268px; right: auto; }
    .book-lookup.open .suggestions { display: block; }

    .suggestions {
      position: absolute;
      top: 38px;
      left: 0;
      right: 0;
      display: none;
      max-height: 265px;
      overflow: auto;
      border: 1px solid #9eacbd;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(31,41,55,.18);
    }
    .combo.open .suggestions { display: block; }
    .suggestion-heading { padding: 8px 11px 5px; color: #667085; background: #f8fafc; font-size: 11px; }
    .suggestion {
      width: 100%; padding: 9px 11px;
      border: 0; border-top: 1px solid #eef0f3;
      background: #fff; text-align: left; cursor: pointer;
    }
    .suggestion:hover, .suggestion.active { background: var(--blue-soft); }
    .suggestion-main { display: flex; align-items: center; gap: 7px; }
    .suggestion strong { color: #172b4d; font-size: 13px; }
    .suggestion-code {
      padding: 1px 5px; border: 1px solid #cad4e2; border-radius: 3px;
      color: #53657b; background: #f8fafc; font-size: 10px;
    }
    .suggestion-meta { margin-top: 3px; color: #667085; font-size: 11px; }
    mark { padding: 0; color: inherit; background: #fff0a8; }
    .no-result { padding: 18px 12px; color: #667085; text-align: center; }

    .search-button {
      height: 34px; margin-top: 0; padding: 0 19px;
      border: 1px solid #1f477f; border-radius: 3px;
      color: #fff; background: var(--blue); font-weight: 700; cursor: pointer;
    }
    .search-button:hover { background: #1f477f; }
    .checkbox-wrap { display: flex; align-items: center; gap: 4px; height: 34px; color: #176286; white-space: nowrap; }

    .selected-summary {
      display: none;
      align-items: center;
      gap: 7px;
      min-height: 39px;
      padding: 6px 10px;
      border: 1px solid #d9e4f2;
      border-top: 0;
      background: #f8fbff;
    }
    .selected-summary.visible { display: flex; }
    .summary-label { color: #53657b; font-weight: 700; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 6px 4px 9px;
      border: 1px solid #b8cae2; border-radius: 14px;
      color: #234a80; background: #fff;
    }
    .chip small { color: #738197; }
    .chip button { border: 0; color: #667085; background: transparent; cursor: pointer; font-size: 15px; line-height: 1; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; height: 32px; }
    .view-links a { color: #001b72; font-size: 14px; font-weight: 700; text-decoration: none; }
    .view-links a + a::before { content: "|"; margin: 0 8px; color: #c4c4c4; }
    .result-count strong { color: #073dd7; }

    .result-table { width: 100%; border-collapse: collapse; table-layout: fixed; border-top: 2px solid #3183e2; }
    .result-table th, .result-table td { height: 34px; padding: 5px 8px; border: 1px solid #dedede; text-align: center; }
    .result-table th { color: #111; background: #f3f3f3; font-weight: 500; }
    .result-table tbody tr:nth-child(odd) { background: #fafafa; }
    .result-table tbody tr:hover { background: #ffff88; }
    .result-table .detail-column { display: none; }
    .result-table.show-details col.detail-column { display: table-column; }
    .result-table.show-details th.detail-column,
    .result-table.show-details td.detail-column { display: table-cell; }
    .result-table td.store, .result-table td.book-title { overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .result-table .muted-cell { color: #98a2b3; }
    .quantity-link { color: #45452e; text-decoration: none; border-bottom: 1px solid #bfc0ad; }
    .view-button { padding: 1px 5px; border: 1px solid #ff514f; border-radius: 2px; color: #ff3936; background: #fff; cursor: pointer; }
    .empty-state { display: none; padding: 48px 20px !important; color: #667085; background: #fff; }

    @media (max-width: 1250px) {
      main { width: calc(100% - 30px); }
      .search-panel { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="top-line"></div>
  <main>
    <h1>도서 출고 및 반품 내역</h1>

    <form id="searchForm" novalidate>
      <div class="search-panel">
        <div class="field-group">
          <label class="field-label" for="startdate">발생일</label>
          <div class="date-row">
            <input class="date-input" id="startdate" type="text" value="2026-07-01" aria-label="시작일">
            <span>~</span>
            <input class="date-input" id="enddate" type="text" value="2026-07-15" aria-label="종료일">
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="storeSearch">서점명</label>
          <div>
            <div class="combo" id="storeCombo">
              <span class="combo-icon" aria-hidden="true">⌕</span>
              <input class="combo-input" id="storeSearch" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="storeList">
              <span class="combo-state">선택 전</span>
              <div class="suggestions" id="storeList" role="listbox"></div>
            </div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="bookSearch">도서명</label>
          <div class="book-lookup" id="bookLookup">
            <select class="search-select" id="bookKey" aria-label="도서 검색 기준">
              <option value="title">도서명</option>
              <option value="isbn">ISBN</option>
              <option value="author">저자명</option>
            </select>
            <input class="book-search-input" id="bookSearch" type="text" autocomplete="off">
            <button class="lookup-button" id="bookLookupButton" type="button">찾기</button>
            <div class="suggestions" id="bookList" role="listbox"></div>
          </div>
        </div>

        <button class="search-button" type="submit">검색</button>
        <label class="checkbox-wrap"><input type="checkbox"> 도서별 보기</label>
      </div>

      <div class="selected-summary" id="selectedSummary" aria-live="polite">
        <span class="summary-label">선택한 검색 조건</span>
        <span id="selectedChips"></span>
      </div>
    </form>

    <div class="toolbar">
      <nav class="view-links" aria-label="기간별 보기">
        <a href="#">일별보기</a><a href="#">월별보기</a><a href="#">분기별보기</a><a href="#">반기별보기</a><a href="#">연도별보기</a>
      </nav>
      <span class="result-count">검색: <strong id="resultCount">8</strong> 건</span>
    </div>

    <table class="result-table" id="resultTable">
      <colgroup>
        <col style="width:5%"><col style="width:10%"><col class="detail-column" style="width:14%"><col class="detail-column" style="width:23%">
        <col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:14%"><col style="width:7%">
      </colgroup>
      <thead>
        <tr><th>No</th><th>입력시점</th><th class="detail-column">서점명</th><th class="detail-column">도서명</th><th>출고수량</th><th>반품수량</th><th>판매수량</th><th>판매금액(천)</th><th>관리</th></tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </main>

  <script src="store_data.js"></script>
  <script>
    const stores = window.STORE_DATA;

    const books = [
      { id: 'B1041', title: '소년이 온다', isbn: '9788936434120', author: '한강', publisher: '창비' },
      { id: 'B1173', title: '작별하지 않는다', isbn: '9788954682152', author: '한강', publisher: '문학동네' },
      { id: 'B1208', title: '채식주의자', isbn: '9788936434595', author: '한강', publisher: '창비' },
      { id: 'B2012', title: '모순', isbn: '9788998441012', author: '양귀자', publisher: '쓰다' },
      { id: 'B2095', title: '모순', isbn: '9788982817334', author: '양귀자', publisher: '살림' },
      { id: 'B3022', title: '초역 부처의 말', isbn: '9791193506202', author: '코이케 류노스케', publisher: '포레스트북스' }
    ];

    const rows = [
      { no: 4215, date: '2026-07-15', storeId: '10747', bookId: 'B1041', out: 294, back: 1, sales: 293, amount: '3,563' },
      { no: 4214, date: '2026-07-14', storeId: '10044', bookId: 'B1173', out: 518, back: 127, sales: 391, amount: '5,297' },
      { no: 4213, date: '2026-07-13', storeId: '10148', bookId: 'B1041', out: 605, back: 0, sales: 605, amount: '7,246' },
      { no: 4212, date: '2026-07-10', storeId: '10136', bookId: 'B2012', out: 156, back: 0, sales: 156, amount: '1,921' },
      { no: 4211, date: '2026-07-09', storeId: '10146', bookId: 'B1208', out: 422, back: 0, sales: 422, amount: '5,037' },
      { no: 4210, date: '2026-07-08', storeId: '90049', bookId: 'B2095', out: 408, back: 0, sales: 408, amount: '4,596' },
      { no: 4209, date: '2026-07-07', storeId: '10072', bookId: 'B3022', out: 235, back: 165, sales: 70, amount: '781' },
      { no: 4208, date: '2026-07-06', storeId: '10103', bookId: 'B2012', out: 272, back: 0, sales: 272, amount: '3,307' }
    ];

    let selectedStore = null;
    let selectedBook = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
    }

    function highlight(value, query) {
      const safe = escapeHtml(value);
      if (!query) return safe;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp(`(${escaped})`, 'ig'), '<mark>$1</mark>');
    }

    function setupCombo(config) {
      const combo = document.getElementById(config.comboId);
      const input = document.getElementById(config.inputId);
      const list = document.getElementById(config.listId);
      let activeIndex = -1;
      let filtered = [];

      function getSelected() { return config.type === 'store' ? selectedStore : selectedBook; }
      function setSelected(value) {
        if (config.type === 'store') selectedStore = value;
        else selectedBook = value;
      }
      function label(item) { return config.type === 'store' ? item.name : item.title; }
      function searchText(item) { return config.type === 'store' ? `${item.name} ${item.id}` : `${item.title} ${item.isbn} ${item.author} ${item.publisher}`; }

      function draw(query = '') {
        const normalized = query.trim().toLowerCase();
        filtered = config.items.filter(item => !normalized || searchText(item).toLowerCase().includes(normalized));
        activeIndex = -1;
        const heading = normalized ? `‘${escapeHtml(query.trim())}’ 검색 결과 ${filtered.length}건` : '최근 선택 · 전체 목록';
        list.innerHTML = `<div class="suggestion-heading">${heading}</div>` + (filtered.length ? filtered.map((item, index) => {
          if (config.type === 'store') {
            return `<button class="suggestion" type="button" role="option" data-index="${index}"><span class="suggestion-main"><strong>${highlight(item.name, query)}</strong><span class="suggestion-code">${highlight(item.id, query)}</span></span></button>`;
          }
          return `<button class="suggestion" type="button" role="option" data-index="${index}"><span class="suggestion-main"><strong>${highlight(item.title, query)}</strong><span class="suggestion-code">ISBN ${highlight(item.isbn, query)}</span></span><span class="suggestion-meta">${highlight(item.author, query)} · ${highlight(item.publisher, query)}</span></button>`;
        }).join('') : '<div class="no-result">일치하는 항목이 없습니다.<br>코드나 ISBN으로 다시 검색해 보세요.</div>');
      }

      function open() { draw(input.value); combo.classList.add('open'); input.setAttribute('aria-expanded', 'true'); }
      function close() { combo.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); activeIndex = -1; }
      function choose(item) {
        setSelected(item);
        input.value = label(item);
        combo.classList.remove('has-error');
        combo.classList.add('is-selected');
        combo.querySelector('.combo-state').textContent = '선택됨';
        close();
        updateSummary();
      }
      function clearSelection(keepText = true) {
        setSelected(null);
        if (!keepText) input.value = '';
        combo.classList.remove('is-selected');
        combo.querySelector('.combo-state').textContent = '선택 전';
        updateSummary();
      }
      function invalidate() {
        combo.classList.add('has-error');
        alert('서점을 목록에서 선택해 주세요.');
        input.focus();
      }

      input.addEventListener('focus', open);
      input.addEventListener('input', () => { if (getSelected()) clearSelection(true); open(); });
      input.addEventListener('keydown', event => {
        const options = [...list.querySelectorAll('.suggestion')];
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          if (!combo.classList.contains('open')) open();
          activeIndex = event.key === 'ArrowDown' ? Math.min(activeIndex + 1, options.length - 1) : Math.max(activeIndex - 1, 0);
          options.forEach((option, index) => option.classList.toggle('active', index === activeIndex));
          options[activeIndex]?.scrollIntoView({ block: 'nearest' });
        } else if (event.key === 'Enter' && combo.classList.contains('open') && activeIndex >= 0) {
          event.preventDefault(); choose(filtered[activeIndex]);
        } else if (event.key === 'Escape') close();
      });
      list.addEventListener('mousedown', event => {
        const option = event.target.closest('.suggestion');
        if (option) { event.preventDefault(); choose(filtered[Number(option.dataset.index)]); }
      });
      document.addEventListener('mousedown', event => { if (!combo.contains(event.target)) close(); });

      return { input, clearSelection, invalidate, getSelected };
    }

    const storeControl = setupCombo({ type:'store', comboId:'storeCombo', inputId:'storeSearch', listId:'storeList', items:stores });

    function setupBookLookup() {
      const lookup = document.getElementById('bookLookup');
      const key = document.getElementById('bookKey');
      const input = document.getElementById('bookSearch');
      const button = document.getElementById('bookLookupButton');
      const list = document.getElementById('bookList');
      let matches = [];

      function choose(book) {
        selectedBook = book;
        input.value = key.value === 'isbn' ? book.isbn : key.value === 'author' ? book.author : book.title;
        lookup.classList.remove('open');
        updateSummary();
      }

      function findBooks() {
        const query = input.value.trim();
        if (!query) {
          alert('검색어를 입력해 주세요.');
          input.focus();
          return;
        }
        const normalized = query.toLowerCase();
        matches = books.filter(book => {
          if (key.value === 'isbn') return book.isbn === query;
          if (key.value === 'author') return book.author.toLowerCase().includes(normalized);
          return book.title.toLowerCase().includes(normalized);
        });
        if (matches.length === 1) {
          choose(matches[0]);
          return;
        }
        if (!matches.length) {
          lookup.classList.remove('open');
          alert('검색된 도서가 없습니다.');
          return;
        }
        list.innerHTML = `<div class="suggestion-heading">검색 결과 ${matches.length}건</div>` + matches.map((book, index) => `<button class="suggestion" type="button" role="option" data-index="${index}"><span class="suggestion-main"><strong>${highlight(book.title, query)}</strong><span class="suggestion-code">ISBN ${highlight(book.isbn, query)}</span></span><span class="suggestion-meta">${highlight(book.author, query)} · ${escapeHtml(book.publisher)}</span></button>`).join('');
        lookup.classList.add('open');
      }

      function clearSelection(keepText = true) {
        selectedBook = null;
        if (!keepText) input.value = '';
        lookup.classList.remove('open');
        updateSummary();
      }

      input.addEventListener('input', () => { if (selectedBook) clearSelection(true); });
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); findBooks(); }
        if (event.key === 'Escape') lookup.classList.remove('open');
      });
      key.addEventListener('change', () => clearSelection(false));
      button.addEventListener('click', findBooks);
      list.addEventListener('mousedown', event => {
        const option = event.target.closest('.suggestion');
        if (option) { event.preventDefault(); choose(matches[Number(option.dataset.index)]); }
      });
      document.addEventListener('mousedown', event => { if (!lookup.contains(event.target)) lookup.classList.remove('open'); });

      return { input, clearSelection, getSelected: () => selectedBook };
    }

    const bookControl = setupBookLookup();

    function updateSummary() {
      const summary = document.getElementById('selectedSummary');
      const chips = document.getElementById('selectedChips');
      const content = [];
      if (selectedStore) content.push(`<span class="chip">서점: <strong>${escapeHtml(selectedStore.name)}</strong> <small>${selectedStore.id}</small><button type="button" data-clear="store" aria-label="선택한 서점 삭제">×</button></span>`);
      if (selectedBook) content.push(`<span class="chip">도서: <strong>${escapeHtml(selectedBook.title)}</strong> <small>${selectedBook.isbn}</small><button type="button" data-clear="book" aria-label="선택한 도서 삭제">×</button></span>`);
      chips.innerHTML = content.join(' ');
      summary.classList.toggle('visible', content.length > 0);
    }

    document.getElementById('selectedChips').addEventListener('click', event => {
      const button = event.target.closest('button[data-clear]');
      if (!button) return;
      if (button.dataset.clear === 'store') storeControl.clearSelection(false);
      else bookControl.clearSelection(false);
      renderRows(Boolean(selectedStore || selectedBook));
    });

    function renderRows(filter = false) {
      const body = document.getElementById('resultBody');
      const showDetails = filter && Boolean(selectedStore || selectedBook);
      document.getElementById('resultTable').classList.toggle('show-details', showDetails);
      const visibleRows = rows.filter(row => (!filter || !selectedStore || row.storeId === selectedStore.id) && (!filter || !selectedBook || row.bookId === selectedBook.id));
      body.innerHTML = visibleRows.map(row => {
        const store = stores.find(item => item.id === row.storeId);
        const book = books.find(item => item.id === row.bookId);
        return `<tr><td>${row.no}</td><td>${row.date}</td><td class="store detail-column" title="거래처 코드 ${store.id}">${escapeHtml(store.name)}</td><td class="book-title detail-column" title="ISBN ${book.isbn} · ${escapeHtml(book.author)}">${escapeHtml(book.title)}</td><td><a class="quantity-link" href="#">${row.out}</a></td><td>${row.back ? `<a class="quantity-link" href="#">${row.back}</a>` : '<span class="muted-cell">-</span>'}</td><td>${row.sales}</td><td>${row.amount}</td><td><button class="view-button" type="button">보기</button></td></tr>`;
      }).join('') || `<tr><td class="empty-state" colspan="${showDetails ? 9 : 7}" style="display:table-cell">선택한 조건에 해당하는 목업 데이터가 없습니다.</td></tr>`;
      document.getElementById('resultCount').textContent = visibleRows.length;
    }

    document.getElementById('searchForm').addEventListener('submit', event => {
      event.preventDefault();
      let invalid = false;
      if (storeControl.input.value.trim() && !selectedStore) { storeControl.invalidate(); invalid = true; }
      if (bookControl.input.value.trim() && !selectedBook) {
        alert('도서 검색의 찾기 버튼을 눌러 도서를 확정해 주세요.');
        bookControl.input.focus();
        invalid = true;
      }
      if (!invalid) renderRows(true);
    });

    renderRows();
  </script>
</body>
</html>
