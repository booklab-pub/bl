<!DOCTYPE html>
<html>
<head>
<style>
    :root {
        --sidebar-bg: #f8f9fa; /* 왼쪽 프레임 배경색과 유사하게 */
        --active-blue: #3498db;
    }

    body { display: flex; margin: 0; font-family: sans-serif; overflow: hidden; }

    /* 1번 사이드바 (기존 프레임 모사) */
    .frame-sidebar {
        width: 180px;
        background: #555;
        color: white;
        height: 100vh;
        flex-shrink: 0;
    }

    /* 2번 사이드바 (ICON - 개선 핵심) */
    .icon-sidebar {
        width: 60px; /* 기본은 좁게 (아이콘만 보임) */
        background: #fff; /* 본문과 같은 색으로 통일 */
        border-right: 1px solid #e0e0e0;
        height: 100vh;
        transition: width 0.3s ease; /* 부드러운 확장 효과 */
        overflow: hidden;
        white-space: nowrap;
        z-index: 10;
    }

    /* 마우스 올리면 확장 */
    .icon-sidebar:hover {
        width: 220px;
        box-shadow: 5px 0 15px rgba(0,0,0,0.05);
    }

    /* 사이드바 내부 아이템 */
    .menu-item {
        display: flex;
        align-items: center;
        padding: 12px 18px;
        cursor: pointer;
        color: #444;
    }

    .menu-item:hover { background: #f0f7ff; }

    .menu-icon {
        font-size: 20px;
        margin-right: 25px; /* 텍스트와의 간격 */
        min-width: 24px;
        text-align: center;
    }

    /* 본문 영역 */
    .content {
        flex-grow: 1;
        background: #fff;
        padding: 20px;
        overflow-y: auto;
    }

    .btn-write {
        background: var(--active-blue);
        color: white;
        border: none;
        padding: 10px;
        width: 80%;
        margin: 10px auto;
        display: block;
        border-radius: 4px;
        text-align: center;
    }
</style>
</head>
<body>

    <div class="frame-sidebar">
        <p style="padding:10px; opacity:0.5;">Main Frame</p>
    </div>

    <div class="icon-sidebar">
        <div class="btn-write">📝 <span class="txt">ICON 쓰기</span></div>
        
        <div class="menu-item">
            <span class="menu-icon">📂</span>
            <span class="txt">모든 ICON</span>
        </div>
        <div class="menu-item">
            <span class="menu-icon">👤</span>
            <span class="txt">내게 쓴 ICON</span>
        </div>
        <div class="menu-item">
            <span class="menu-icon">⚙️</span>
            <span class="txt">시스템 개발</span>
        </div>
        <div class="menu-item">
            <span class="menu-icon">⚖️</span>
            <span class="txt">법률자문</span>
        </div>
    </div>

    <div class="content">
        <h2>본문 영역</h2>
        <p>사이드바가 좁아진 만큼 본문을 더 넓게 볼 수 있습니다.</p>
        <div style="height: 1000px; background: #f9f9f9; border: 1px dashed #ccc; padding: 20px;">
            여기에 ICON 리스트나 상세 내용이 들어갑니다.
        </div>
    </div>

</body>
</html>


</body>
</html>
