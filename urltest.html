<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하이웍스 우회 - 인터넷 바로가기 생성 테스트</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px;
            background-color: #f5f6f7;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #1a73e8;
            font-size: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .form-group {
            margin-top: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1557b0;
        }
        .info {
            margin-top: 20px;
            background-color: #e8f0fe;
            padding: 15px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔗 크롬 강제 실행용 바로가기(.url) 생성기</h2>
    <p style="font-size: 13px; color: #666;">테스트용 페이지입니다. 입력한 URL로 연결되는 윈도우 바로가기 파일을 생성합니다.</p>
    
    <div class="form-group">
        <label for="urlInput">공유할 관리자 페이지 URL 입력</label>
        <input type="text" id="urlInput" value="https://www.book.co.kr/essay_ver2/admin/main.php" placeholder="https://...">
    </div>
    
    <button onclick="generateShortcut()">바라가기 파일(.url) 다운로드</button>

    <div class="info">
        <strong>💡 테스트 방법:</strong><br>
        1. 버튼을 눌러 <code>북랩_관리자_바로가기.url</code> 파일을 다운로드합니다.<br>
        2. 다운로드된 파일을 <strong>하이웍스 메신저</strong>로 직원에게 전송해 봅니다.<br>
        3. 상대방이 메신저 창에서 해당 파일을 더블클릭했을 때, 엣지가 아닌 <strong>크롬 브라우저</strong>로 열리는지 확인합니다.
    </div>
</div>

<script>
function generateShortcut() {
    const urlInput = document.getElementById('urlInput').value.trim();
    
    if (!urlInput) {
        alert('URL을 입력해 주세요.');
        return;
    }

    // 윈도우 인터넷 바로가기 파일(.url) 표준 규격 텍스트 생성
    const shortcutContent = `[InternetShortcut]\nURL=${urlInput}\n`;
    
    // Blob 객체를 이용해 메모리 상에 파일 데이터 생성
    const blob = new Blob([shortcutContent], { type: 'application/internet-shortcut' });
    
    // 다운로드용 임시 링크 생성 및 클릭 트리거
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "북랩_관리자_바로가기.url"; // 다운로드될 파일명
    
    document.body.appendChild(link);
    link.click();
    
    // 메모리 정리 및 링크 제거
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
}
</script>

</body>
</html>
