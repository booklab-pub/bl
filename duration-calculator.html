<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소요 시간 계산기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111113;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --picker-bg: #252528;
    --picker-highlight: #3a3a3c;
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.45);
    --text-dim: rgba(255,255,255,0.18);
    --accent: #f5a623;
    --accent2: #ff6b35;
    --radius: 20px;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  /* subtle noise texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 1;
  }

  .app-title {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 32px;
  }

  .pickers-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  .picker-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px 8px;
    border: 1px solid rgba(255,255,255,0.06);
    min-width: 0;
  }

  .picker-label {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    margin-bottom: 14px;
    text-align: center;
  }

  .time-field {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .time-control {
    position: relative;
    min-height: 92px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    background: var(--picker-bg);
    overflow: hidden;
    cursor: pointer;
  }

  .time-control:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245,166,35,0.18);
  }

  .time-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    color-scheme: dark;
  }

  .time-display {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    pointer-events: none;
  }

  .time-ampm {
    font-size: 34px;
    font-weight: 400;
    line-height: 1;
    text-align: right;
  }

  .time-clock {
    font-family: 'DM Mono', monospace;
    font-size: 38px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0;
    white-space: nowrap;
  }

  /* ── Result Card ── */
  .result-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px 24px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .result-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .result-value {
    font-family: 'DM Mono', monospace;
    font-size: 44px;
    font-weight: 300;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .result-value span.accent {
    color: var(--accent);
  }

  .result-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .result-sub strong {
    color: var(--text-primary);
    font-weight: 500;
  }

  /* 아이폰 12 미니 (375px) 이하: 세로 레이아웃으로 전환 */
  @media (max-width: 400px) {
    .pickers-row {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .picker-card {
      padding: 16px 12px;
    }
    .time-control { min-height: 86px; }
    .time-ampm { font-size: 32px; }
    .time-clock { font-size: 36px; }
    .result-value { font-size: 40px; }
  }

  @media (max-width: 320px) {
    .time-display { gap: 8px; padding: 0 14px; }
    .time-ampm { font-size: 28px; }
    .time-clock { font-size: 32px; }
    .result-value { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="container">
  <p class="app-title">소요 시간 계산기</p>

  <div class="pickers-row">
    <!-- 시작 시각 -->
    <div class="picker-card">
      <p class="picker-label">시작 시각</p>
      <div class="time-field">
        <div class="time-control">
          <input class="time-input" id="start-time" type="time" value="22:30" step="60" aria-label="시작 시각">
          <p class="time-display" id="start-display"></p>
        </div>
      </div>
    </div>

    <!-- 종료 시각 -->
    <div class="picker-card">
      <p class="picker-label">종료 시각</p>
      <div class="time-field">
        <div class="time-control">
          <input class="time-input" id="end-time" type="time" value="04:50" step="60" aria-label="종료 시각">
          <p class="time-display" id="end-display"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- 결과 -->
  <div class="result-card">
    <p class="result-label">소요 시간</p>
    <p class="result-value" id="result-value">0<span class="accent">h</span> 00<span class="accent">m</span></p>
    <p class="result-sub" id="result-sub"></p>
  </div>
</div>

<script>
const startInput = document.getElementById('start-time');
const endInput = document.getElementById('end-time');
const startDisplay = document.getElementById('start-display');
const endDisplay = document.getElementById('end-display');

function pad(n) { return String(n).padStart(2,'0'); }

function parseTime(value) {
  const match = /^(\d{2}):(\d{2})$/.exec(value);
  if (!match) return null;

  const hour = Number(match[1]);
  const minute = Number(match[2]);
  if (hour > 23 || minute > 59) return null;

  return hour * 60 + minute;
}

function fmtTime(min) {
  const normalized = ((min % 1440) + 1440) % 1440;
  const hh = Math.floor(normalized / 60);
  const mm = normalized % 60;
  const ap = hh < 12 ? '오전' : '오후';
  const disp = hh % 12 === 0 ? 12 : hh % 12;
  return `${ap} ${disp}:${pad(mm)}`;
}

function renderTimeDisplay(el, min) {
  const normalized = ((min % 1440) + 1440) % 1440;
  const hh = Math.floor(normalized / 60);
  const mm = normalized % 60;
  const ap = hh < 12 ? '오전' : '오후';
  const disp = hh % 12 === 0 ? 12 : hh % 12;

  el.innerHTML = `<span class="time-ampm">${ap}</span><span class="time-clock">${pad(disp)}:${pad(mm)}</span>`;
}

function calculate() {
  const startMin = parseTime(startInput.value);
  const endMin = parseTime(endInput.value);

  if (startMin === null || endMin === null) return;

  let diff = endMin - startMin;

  const sub  = document.getElementById('result-sub');
  const val  = document.getElementById('result-value');

  if (diff < 0) {
    diff += 24 * 60;
  }

  const h = Math.floor(diff / 60);
  const m = diff % 60;

  val.innerHTML = `${h}<span class="accent">h</span> ${pad(m)}<span class="accent">m</span>`;
  sub.innerHTML = `<strong>${fmtTime(startMin)}</strong> → <strong>${fmtTime(endMin)}</strong>`;
  renderTimeDisplay(startDisplay, startMin);
  renderTimeDisplay(endDisplay, endMin);
}

startInput.addEventListener('input', calculate);
endInput.addEventListener('input', calculate);

document.querySelectorAll('.time-control').forEach(control => {
  const input = control.querySelector('.time-input');
  control.addEventListener('click', () => {
    input.focus();
    if (typeof input.showPicker === 'function') input.showPicker();
  });
});

calculate();
</script>
</body>
</html>
