<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>엣지→크롬 이동 테스트 페이지</title>
<style>
  body { font-family: sans-serif; padding: 40px; line-height: 1.6; }
  .info-box { background:#f0f4f8; border:1px solid #c7d6e0; border-radius:6px; padding:16px; margin-top:20px; }
  code { background:#eee; padding:2px 6px; border-radius:3px; }
</style>
</head>
<body>

<h2>게시판 링크 → 크롬 이동 테스트</h2>
<p>게시판 글 주소를 입력하고 이동 버튼을 누르면, 엣지일 경우 크롬으로 강제 이동을 시도합니다.</p>

<div class="info-box">
  <label for="urlInput" style="display:block; margin-bottom:6px; font-weight:bold;">게시판 글 주소 입력:</label>
  <input type="text" id="urlInput" placeholder="https://www.book.co.kr/MWebhard/admin_view.php?..."
    style="width:100%; box-sizing:border-box; padding:8px; font-size:14px; border:1px solid #ccc; border-radius:4px;">
  <button id="goBtn" style="margin-top:10px; padding:8px 16px; background:#3d75a8; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:14px;">이동</button>
</div>

<div class="info-box">
  <b>현재 브라우저 감지 결과:</b>
  <p id="browserResult">확인 중...</p>
</div>

<script>
(function(){
  var STORAGE_KEY = 'lastBoardUrl';
  var urlInput = document.getElementById('urlInput');
  var goBtn = document.getElementById('goBtn');

  // 마지막으로 입력했던 주소를 기억해서 다시 채워줌
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) urlInput.value = saved;
  } catch(e) {}

  var ua = navigator.userAgent;
  var isEdge = ua.indexOf('Edg/') > -1;
  document.getElementById('browserResult').textContent =
    isEdge ? '엣지(Edge)로 열려 있습니다.' : '엣지가 아닙니다. (User-Agent: ' + ua + ')';

  function goToUrl(targetUrl) {
    if (!targetUrl) {
      alert('게시판 글 주소를 입력해주세요.');
      return;
    }
    try { localStorage.setItem(STORAGE_KEY, targetUrl); } catch(e) {}

    if (isEdge) {
      window.location.href = 'googlechrome:' + targetUrl;
    } else {
      window.location.href = targetUrl;
    }
  }

  goBtn.onclick = function(){
    goToUrl(urlInput.value.trim());
  };
  urlInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') goToUrl(urlInput.value.trim());
  });
})();
</script>

</body>
</html>
