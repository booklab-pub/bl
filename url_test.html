<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>엣지→크롬 이동 테스트 페이지</title>
<style>
  body { font-family: sans-serif; padding: 40px; line-height: 1.6; }
  .info-box { background:#f0f4f8; border:1px solid #c7d6e0; border-radius:6px; padding:16px; margin-top:20px; }
  code { background:#eee; padding:2px 6px; border-radius:3px; }
</style>
</head>
<body>

<h2>게시판 링크 → 크롬 이동 테스트</h2>
<p>게시판 글 주소를 입력하면, 그 주소가 담긴 <b>공유용 링크</b>를 만들어줍니다. 그 링크를 메신저로 보내세요.</p>

<div class="info-box">
  <label for="urlInput" style="display:block; margin-bottom:6px; font-weight:bold;">게시판 글 주소 입력:</label>
  <input type="text" id="urlInput" placeholder="https://www.book.co.kr/MWebhard/admin_view.php?..."
    style="width:100%; box-sizing:border-box; padding:8px; font-size:14px; border:1px solid #ccc; border-radius:4px;">
  <div style="margin-top:10px;">
    <button id="makeLinkBtn" style="padding:8px 16px; background:#3d75a8; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:14px;">공유용 링크 만들기</button>
    <button id="goBtn" style="padding:8px 16px; background:#777; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:14px;">바로 이동(내 테스트용)</button>
  </div>
  <div id="shareLinkBox" style="display:none; margin-top:14px; padding:10px; background:#fff; border:1px solid #b8d9e1; border-radius:4px;">
    <div style="font-size:13px; color:#555; margin-bottom:6px;">아래 링크를 복사해서 메신저로 보내세요:</div>
    <input type="text" id="shareLinkText" readonly style="width:100%; box-sizing:border-box; padding:6px; font-size:13px; border:1px solid #ccc; border-radius:4px;">
  </div>
</div>

<div class="info-box">
  <b>현재 브라우저 감지 결과:</b>
  <p id="browserResult">확인 중...</p>
</div>

<script>
(function(){
  var urlInput = document.getElementById('urlInput');
  var goBtn = document.getElementById('goBtn');
  var makeLinkBtn = document.getElementById('makeLinkBtn');
  var shareLinkBox = document.getElementById('shareLinkBox');
  var shareLinkText = document.getElementById('shareLinkText');

  // 링크의 ?url= 파라미터로 전달받은 주소가 있으면 자동으로 채워줌 (받는 사람 쪽)
  var params = new URLSearchParams(window.location.search);
  var incomingUrl = params.get('url');
  if (incomingUrl) {
    urlInput.value = incomingUrl;
  }

  var ua = navigator.userAgent;
  var isEdge = ua.indexOf('Edg/') > -1;
  document.getElementById('browserResult').textContent =
    isEdge ? '엣지(Edge)로 열려 있습니다.' : '엣지가 아닙니다. (User-Agent: ' + ua + ')';

  function goToUrl(targetUrl) {
    if (!targetUrl) {
      alert('게시판 글 주소를 입력해주세요.');
      return;
    }
    if (isEdge) {
      var fallback = function(){
        prompt('아래 주소를 복사해서 크롬 주소창에 붙여넣어 주세요:', targetUrl);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(targetUrl).then(function(){
          alert('주소가 복사되었습니다.\n크롬을 직접 열어서 주소창에 붙여넣기(Ctrl+V) 해주세요.');
        }).catch(fallback);
      } else {
        fallback();
      }
    } else {
      window.location.href = targetUrl;
    }
  }

  makeLinkBtn.onclick = function(){
    var targetUrl = urlInput.value.trim();
    if (!targetUrl) {
      alert('게시판 글 주소를 먼저 입력해주세요.');
      return;
    }
    var base = window.location.origin + window.location.pathname;
    var shareLink = base + '?url=' + encodeURIComponent(targetUrl);
    shareLinkText.value = shareLink;
    shareLinkBox.style.display = 'block';
    shareLinkText.focus();
    shareLinkText.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareLink).catch(function(){});
    }
  };

  goBtn.onclick = function(){
    goToUrl(urlInput.value.trim());
  };
  urlInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') goToUrl(urlInput.value.trim());
  });

  // 받는 사람 쪽: 링크로 들어왔고 엣지일 경우, 자동으로 안내를 띄워줌
  if (incomingUrl && isEdge) {
    goToUrl(incomingUrl);
  } else if (incomingUrl && !isEdge) {
    // 크롬으로 정상 진입한 경우 바로 이동
    window.location.href = incomingUrl;
  }
})();
</script>

</body>
</html>
